<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag - Forms</title>
</head>

<body>
    <h2>Cadastro de alunos</h2>

    <form action="#">
        <label for="campo_nome">Nome:</label>
        <input type="text" name="nome_usuario" id="campo_nome">
        <br><br>
        
        <label for="contato_email">E-mail:</label>
        <input type="email" name="email" id="contato_email">

        <br><br>

        <label for="contato">Contato:</label>
        <input type="number" name="telefone" id="contato">

        <br><br>
        <input type="submit" value="Enviar">
    </form>
</body>

</html>
