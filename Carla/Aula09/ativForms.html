<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Formulários</title>
</head>
<body>
    <h2>Tela de Aluno</h2>
    <form action="#">
        <label for="campo_nome">NOME:</label>
        <input type="text" name="nome_aluno" id="campo_nome">

        <br><br>

        <label for="contato_email">E-MAIL:</label>
        <input type="email" name="email" id="contato_email">

        <br><br>

        <label for="campo_idade">IDADE:</label>
        <input type="number" name="idade_aluno" id="campo_idade" min="0" max="100">

        <label for="campo_cep">CEP:</label>
        <input type="number" name="cep_aluno" id="campo_cep" placeholder="EX: 02277-110">

        <br><br>

        <label for="senha">SENHA:</label>
        <input type="password" name="senha_aluno" id="senha">

        <br><br>

        <input type="submit" name="Login">
    </form>
</body>
</html>
